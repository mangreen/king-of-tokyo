name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm 版本由 package.json 的 packageManager 欄位固定
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
